<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>南京地图展示</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Leaflet Heat Plugin CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.css" />
    
    <!-- 自定义样式 -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- 左侧控制面板 -->
        <aside class="control-panel">
            <div class="panel-header">
                <h1>地图控制</h1>
            </div>

            <!-- 图层控制 -->
            <div class="panel-section">
                <h2>图层控制</h2>
                <div class="layer-controls">
                    <div class="layer-item">
                        <label>
                            <input type="checkbox" id="layer-boundary" checked>
                            <span>南京市界</span>
                        </label>
                    </div>
                    <div class="layer-item">
                        <label>
                            <input type="checkbox" id="layer-roads" checked>
                            <span>一级道路</span>
                        </label>
                    </div>
                    <div class="layer-item">
                        <label>
                            <input type="checkbox" id="layer-metro-lines" checked>
                            <span>地铁线路</span>
                        </label>
                    </div>
                    <div class="layer-item">
                        <label>
                            <input type="checkbox" id="layer-metro-stations" checked>
                            <span>地铁站点</span>
                        </label>
                    </div>
                    <div class="layer-item">
                        <label>
                            <input type="checkbox" id="layer-scenic-spots" checked>
                            <span>景点</span>
                        </label>
                    </div>
                    <div class="layer-item">
                        <label>
                            <input type="checkbox" id="layer-hotels" checked>
                            <span>酒店</span>
                        </label>
                    </div>
                    <div class="layer-item">
                        <label>
                            <input type="checkbox" id="layer-heatmap">
                            <span>热力图</span>
                        </label>
                    </div>
                </div>
            </div>

            <!-- 样式编辑 -->
            <div class="panel-section">
                <h2>样式编辑</h2>
                <div class="style-controls">
                    <div class="style-group">
                        <label for="layer-select">选择图层：</label>
                        <select id="layer-select">
                            <option value="boundary">南京市界</option>
                            <option value="roads">一级道路</option>
                            <option value="metroLines">地铁线路</option>
                            <option value="metroStations">地铁站点</option>
                            <option value="scenicSpots">景点</option>
                            <option value="hotels">酒店</option>
                        </select>
                    </div>

                    <!-- 颜色选择 -->
                    <div class="style-group" id="color-control">
                        <label>颜色：</label>
                        <input type="color" id="color-picker">
                    </div>

                    <!-- 填充颜色（仅面要素） -->
                    <div class="style-group" id="fill-color-control" style="display: none;">
                        <label>填充颜色：</label>
                        <input type="color" id="fill-color-picker">
                    </div>

                    <!-- 透明度 -->
                    <div class="style-group">
                        <label for="opacity-slider">透明度：</label>
                        <input type="range" id="opacity-slider" min="0" max="1" step="0.1" value="1">
                        <span id="opacity-value">100%</span>
                    </div>
                    <div class="style-group">
                        <label for="basemap-opacity-slider">底图透明度：</label>
                        <input type="range" id="basemap-opacity-slider" min="0" max="1" step="0.05" value="1">
                        <span id="basemap-opacity-value">100%</span>
                    </div>

                    <!-- 点大小/线宽 -->
                    <div class="style-group" id="size-control">
                        <label id="size-label">大小：</label>
                        <input type="range" id="size-slider" min="1" max="20" step="1" value="8">
                        <span id="size-value">8</span>
                    </div>

                    <!-- 标签显示 -->
                    <div class="style-group">
                        <label>
                            <input type="checkbox" id="show-labels">
                            <span>显示标签</span>
                        </label>
                    </div>
                </div>
            </div>

            <!-- 配置管理 -->
            <div class="panel-section">
                <h2>配置管理</h2>
                <div class="config-controls">
                    <button id="export-config" class="btn btn-primary">导出配置</button>
                    <button id="import-config" class="btn btn-secondary">导入配置</button>
                    <button id="reset-config" class="btn btn-danger">重置默认</button>
                    <input type="file" id="config-file-input" accept=".json" style="display: none;">
                </div>
            </div>
        </aside>

        <!-- 地图容器 -->
        <main class="map-container">
            <div id="map"></div>
        </main>
    </div>

    <!-- Proj4js -->
    <script src="https://unpkg.com/proj4@2.9.0/dist/proj4.js"></script>
    
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Leaflet Heat Plugin -->
    <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
    
    <!-- 应用脚本 -->
    <script src="js/dataLoader.js"></script>
    <script src="js/mapManager.js"></script>
    <script src="js/styleEditor.js"></script>
    <script src="js/layerManager.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
